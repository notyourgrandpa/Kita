<div class="flex justify-between items-start mb-6">
  <div>
    <h1 class="!font-extrabold !text-[27px] !m-0">Categories</h1>
    <p class="text-gray-500 !mt-1">Manage your product categories...</p>
  </div>
  <button mat-flat-button color="primary"
        class="btn-add" *ngIf="categories" (click)="openCategoryEditDialog()">
    <mat-icon>add</mat-icon>Add a new Category
  </button>
</div>

<div class="bg-white rounded-lg border p-3 mb-4">
  <mat-form-field class="w-full rounded-l" [hidden]="!categories" appearance="outline">
    <input matInput #filter (keyup)="onFilterTextChanged(filter.value)"
          placeholder="Filter by name (or part of it)...">
    <mat-icon matIconPrefix>search</mat-icon>
  </mat-form-field>
</div>

<!-- LOADING -->
  <div *ngIf="isLoading" class="loading-container">

    <mat-spinner diameter="40"></mat-spinner>

    <p>Loading categories...</p>

  </div>


<div *ngIf="!isLoading" class="bg-white border border-gray-300 rounded-2xl overflow-hidden">
  <table mat-table [dataSource]="categories"
       class="mat-elevation-z8"
       [hidden]="!categories"
       matSort (matSortChange)="loadData()"
       [matSortActive]="defaultSortColumn"
       [matSortDirection]="defaultSortOrder">

    <tr style="display:none!important">
      <!-- Name Column -->
      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Name</th>
        <td mat-cell *matCellDef="let category">{{category.name}}</td>
      </ng-container>

      <!-- IsActive Column -->
      <ng-container matColumnDef="isActive">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Active</th>
        <td mat-cell *matCellDef="let category">
          <span
            class="status-badge"
            [class.active]="category.isActive"
            [class.inactive]="!category.isActive">

            <span class="status-dot"></span>

            {{ category.isActive ? 'Active' : 'Inactive' }}

          </span>
        </td>
      </ng-container>

      <!-- Total Products Column -->
      <ng-container matColumnDef="totalProducts">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Total Products</th>
        <td mat-cell *matCellDef="let category">
          {{category.totalProducts}}
          <button mat-icon-button color="warn" (click)="viewCategoryProducts(category.id)" matTooltip="Open Category Products">
            <mat-icon>assignment</mat-icon>
          </button>
        </td>
      </ng-container>

      <!-- Action Column -->
      <ng-container matColumnDef="action">
        <th mat-header-cell *matHeaderCellDef>Actions</th>
        <td mat-cell *matCellDef="let category">
          <button mat-icon-button color="primary" (click)="openCategoryEditDialog(category.id)" matTooltip="Edit">
            <mat-icon>edit</mat-icon>
          </button>
        </td>
      </ng-container>
    </tr>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  </table>

  <!-- Pagination directive -->
  <mat-paginator
                (page)="getData($event)"
                [pageSize]="pageSize"
                [pageIndex]="pageIndex"
                [length]="totalCount"
                [pageSizeOptions]="[10, 20, 50]"
                showFirstLastButtons>

  </mat-paginator>

</div>
