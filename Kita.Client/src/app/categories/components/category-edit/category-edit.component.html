<div class="category-edit p-4">
  <h1>{{ title }}</h1>

  <p *ngIf="id && !category">
    <em>Loading...</em>
  </p>

  <form [formGroup]="form" (ngSubmit)="onSubmit()">

    <mat-form-field>
      <mat-label>Name:</mat-label>

      <input
        matInput
        formControlName="name"
        required
        placeholder="Type a name"
      >

      <mat-error *ngFor="let error of getErrors(form.get('name')!, 'Name')">
        {{ error }}
      </mat-error>
    </mat-form-field>

    <div class="flex items-center justify-between">

      <div>
        <button
          mat-flat-button
          color="primary"
          type="submit"
          [disabled]="form.invalid">
          {{ id ? 'Save changes' : 'Create category' }}
        </button>
        
        <button
          mat-button
          type="button"
          [routerLink]="['/categories']">
          Cancel
        </button>
      </div>

      <button
        *ngIf="id"
        mat-icon-button
        type="button"
        [matMenuTriggerFor]="actionsMenu"
        aria-label="Category actions">
        <mat-icon>more_vert</mat-icon>
      </button>

    </div>

  </form>

  <!-- Keep menu outside the form -->
  <mat-menu #actionsMenu="matMenu">

    <button
      mat-menu-item
      type="button"
      (click)="onToggleArchive()">

      <mat-icon>
        {{ category?.isActive ? 'archive' : 'unarchive' }}
      </mat-icon>

      <span>
        {{ category?.isActive ? 'Archive' : 'Unarchive' }}
      </span>

    </button>

    <button
      mat-menu-item
      type="button"
      class="text-red-600"
      (click)="onDelete()">

      <mat-icon>delete</mat-icon>
      <span>Delete</span>

    </button>

  </mat-menu>
</div>
