<div class="flex justify-between">
  <h1 class="!font-extrabold">Expenses</h1>
  <button mat-flat-button color="primary" class="btn-add" *ngIf="expenses" [routerLink]="['/expense']">
      Add a new Expense
    </button>
</div>

<div class="bg-white border border-gray-300 p-3 rounded-2xl">
  <mat-form-field [hidden]="!expenses">
    <mat-icon matPrefix>search</mat-icon>
    <input matInput #filter (keyup)="onFilterTextChanged(filter.value)"
          placeholder="Filter by name (or part of it)...">
  </mat-form-field>
</div>

<div *ngIf="isLoading" class="flex flex-col justify-center items-center min-h-[300px]">
  <mat-spinner diameter="40">
  </mat-spinner>
  <p class="text-gray-500">Loading Expenses...</p>
</div>

<div *ngIf="!isLoading" class="bg-white border border-gray-300 rounded-2xl w-full overflow-x-auto mt-3">
  <table mat-table
    [dataSource]="expenses"
    [hidden]="!expenses"
    matSort (matSortChange)="loadData()"
    [matSortActive]="defaultSortColumn"
    [matSortDirection]="defaultSortOrder">

    <ng-container matColumnDef="id">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>ID</th>
      <td mat-cell *matCellDef="let expense">{{ expense.id }}</td>
    </ng-container>

    <ng-container matColumnDef="category">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Category</th>
      <td mat-cell *matCellDef="let expense">{{ expense.category }}</td>
    </ng-container>

    <ng-container matColumnDef="description">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Description</th>
      <td mat-cell *matCellDef="let expense">{{ expense.description }}</td>
    </ng-container>

    <ng-container matColumnDef="amount">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Amount</th>
      <td mat-cell *matCellDef="let expense">{{ expense.amount }}</td>
    </ng-container>

    <ng-container matColumnDef="date">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Date</th>
      <td mat-cell *matCellDef="let expense">{{ expense.date }}</td>
    </ng-container>


    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
  </table>

  <mat-paginator 
    [hidden]="!expenses" 
    (page)="getData($event)" 
    [pageSize]=pageSize 
    [pageIndex]=pageIndex
    [length]=totalCount 
    [pageSizeOptions]="[10, 20, 50]" 
    showFirstLastButtons>

  </mat-paginator>
</div>
