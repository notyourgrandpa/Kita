<div class="flex justify-between items-start">
  <div>
    <h1 class="!mb-0 !font-extrabold">Sales Transactions</h1>
    <p class="text-gray-500">Manage your sales transactions...</p>
  </div>
  <button mat-flat-button color="primary"
          class="btn-add" [routerLink]="['/sales-transaction']">
    Add a new Sales Transaction
  </button>
</div>

<div class="bg-white border border-gray-200 rounded-2xl p-3 my-3">
  <mat-form-field [hidden]="!salesTransactions">
    <mat-icon matPrefix>search</mat-icon>
    <input matInput #filter (keyup)="onFilterTextChanged(filter.value)"
          placeholder="Filter by name (or part of it)...">
  </mat-form-field>
</div>

<div *ngIf="isLoading" class="flex flex-col justify-center items-center min-h-[300px]">
  <mat-spinner diameter="40">
  </mat-spinner>
  <p class="text-gray-500">Loading Sales Transactions...</p>
</div>

<div *ngIf="!isLoading" class="bg-white border border-gray-200 rounded-2xl w-full overflow-x-auto">
  <table mat-table [dataSource]="salesTransactions"
       
       [hidden]="!salesTransactions"
       matSort (matSortChange)="loadData()"
       [matSortActive]="defaultSortColumn"
       [matSortDirection]="defaultSortOrder">

    <tr style="display:none!important">
      <!-- Total Amount Column -->
      <ng-container matColumnDef="totalAmount">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Total Amount</th>
        <td mat-cell *matCellDef="let salesTransaction">{{salesTransaction.totalAmount}}</td>
      </ng-container>

      <!-- Payment Method Column -->
      <ng-container matColumnDef="paymentMethod">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Payment Method</th>
        <td mat-cell *matCellDef="let salesTransaction">{{salesTransaction.paymentMethod}}</td>
      </ng-container>

      <!-- Processed by Column -->
      <ng-container matColumnDef="processedByUsername">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Processed by</th>
        <td mat-cell *matCellDef="let salesTransaction">{{salesTransaction.processedByUserName}}</td>
      </ng-container>

      <!-- Date Column -->
      <ng-container matColumnDef="date">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Date</th>
        <td mat-cell *matCellDef="let salesTransaction">{{salesTransaction.date | date: 'short'}}</td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef>Actions</th>
        <td mat-cell *matCellDef="let salesTransaction">
          <button mat-icon-button color="primary" [routerLink]="['/salesTransaction', salesTransaction.id]" matTooltip="Edit">
            <mat-icon>edit</mat-icon>
          </button>
          <button mat-icon-button color="warn" (click)="onDelete(salesTransaction.id)" matTooltip="Delete">
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>
    </tr>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  </table>

  <!-- Pagination directive -->
  <mat-paginator [hidden]="!salesTransactions"
                (page)="getData($event)"
                [pageIndex]="pageIndex"
                [pageSize]="pageSize"
                [length]="totalCount"
                [pageSizeOptions]="[10, 20, 50]"
                showFirstLastButtons>

  </mat-paginator>
</div>
