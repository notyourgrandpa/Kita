<div class="flex justify-between">
  <h1 class="!font-extrabold">Inventory Logs</h1>

  <button mat-flat-button color="primary"
          class="btn-add" *ngIf="inventoryLogs" (click)="openInventoryLogEditDialog()">
    Add a new Inventory Log
  </button>
</div>

<div class="bg-white border border-gray-200 rounded-2xl p-3 my-3">
  <mat-form-field [hidden]="!inventoryLogs" appearance="outline">
  <mat-icon matPrefix>
    search
  </mat-icon>
  <input matInput #filter (keyup)="onFilterTextChanged(filter.value)"
         placeholder="Filter by name (or part of it)...">
  </mat-form-field>
</div>

<div *ngIf="isLoading" class=" flex flex-col justify-center items-center diameter-40 min-h-[300px]">
  <mat-spinner diameter="40"></mat-spinner>
  <p class="text-gray-500">Loading Inventory Logs...</p>
</div>

<div *ngIf="!isLoading" class="bg-white border border-gray-300 rounded-2xl overflow-hidden">
  <table mat-table [dataSource]="inventoryLogs"
       class="mat-elevation-z8"
       [hidden]="!inventoryLogs"
       matSort (matSortChange)="loadData()"
       [matSortActive]="defaultSortColumn"
       [matSortDirection]="defaultSortOrder">

  <!-- Id Column -->
  <ng-container matColumnDef="id">
    <th mat-header-cell *matHeaderCellDef mat-sort-header>ID</th>
    <td mat-cell *matCellDef="let inventoryLog">{{inventoryLog.id}}</td>
  </ng-container>


  <!-- Product Column -->
  <ng-container matColumnDef="productName">
    <th mat-header-cell *matHeaderCellDef mat-sort-header>Product</th>
    <td mat-cell *matCellDef="let inventoryLog">
      <button class="link-button" (click)="openProductDialog(inventoryLog.productId)">
        {{ inventoryLog.productName }}
      </button>
    </td>
  </ng-container>

  <!-- Date Column -->
  <ng-container matColumnDef="date">
    <th mat-header-cell *matHeaderCellDef mat-sort-header>Date</th>
    <td mat-cell *matCellDef="let inventoryLog">{{inventoryLog.date | date:'short'}}</td>
  </ng-container>

  <!-- Quantity Column -->
  <ng-container matColumnDef="quantity">
    <th mat-header-cell *matHeaderCellDef mat-sort-header>Quantity </th>
    <td mat-cell *matCellDef="let inventoryLog">{{inventoryLog.quantity}}</td>
  </ng-container>

  <!-- Change Type Column -->
  <ng-container matColumnDef="changeType">
    <th mat-header-cell *matHeaderCellDef mat-sort-header>Type</th>
    <td mat-cell *matCellDef="let inventoryLog">
      <mat-chip-listbox>
        <mat-chip highlighted
                  [color]="
          inventoryLog.changeType === 1 ? 'primary' :
          inventoryLog.changeType === 2 ? 'warn' :
          'accent'
        ">
          {{ inventoryLog.changeType | inventoryChangeType }}
        </mat-chip>
      </mat-chip-listbox>
    </td>
  </ng-container>


  <!-- Remarkss Column -->
  <ng-container matColumnDef="remarks">
    <th mat-header-cell *matHeaderCellDef mat-sort-header>Remarks</th>
    <td mat-cell *matCellDef="let inventoryLog">{{inventoryLog.remarks}}</td>
  </ng-container>


  <ng-container matColumnDef="actions">
    <th mat-header-cell *matHeaderCellDef>Actions</th>

    <td mat-cell *matCellDef="let inventoryLog">

      <mat-chip color="warn" selected *ngIf="inventoryLog.isVoided">
        VOIDED
      </mat-chip>

      <button mat-icon-button
              color="primary"
              (click)="openInventoryLogDetailsDialog(inventoryLog.id)"
              matTooltip="Details"
              *ngIf="!inventoryLog.isVoided">
        <mat-icon>description</mat-icon>
      </button>

      <!--<button mat-icon-button
              color="primary"
              [routerLink]="['/inventory-log', inventoryLog.id]"
              matTooltip="Edit"
              *ngIf="!inventoryLog.isVoided">
        <mat-icon>edit</mat-icon>
      </button>-->

    </td>
  </ng-container>


  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row [class.voided]="row.isVoided" *matRowDef="let row; columns: displayedColumns;"></tr>
</table>

<!-- Pagination directive -->
<mat-paginator [hidden]="!inventoryLogs"
               (page)="getData($event)"
               [pageSize]="pageSize"
               [pageIndex]="pageIndex"
               [length]="totalCount"
               [pageSizeOptions]="[10, 20, 50]"
               showFirstLastButtons>

</mat-paginator>
</div>
