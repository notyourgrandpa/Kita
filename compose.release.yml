# Keep the existing default project and persistent volume names.
name: generalpurposeapplication

services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${SQL_PASSWORD:?Set SQL_PASSWORD}
    volumes:
      - sqlserver_data:/var/opt/mssql

  backend:
    image: kita-backend:${RELEASE_TAG:?Set RELEASE_TAG}
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      RunningInDocker: "true"
      AllowedCORS: ${APP_ORIGIN:?Set APP_ORIGIN}
      ConnectionStrings__DefaultConnection: "Server=db,1433;Database=GeneralPurposeApplication;User Id=sa;Password=${SQL_PASSWORD:?Set SQL_PASSWORD};TrustServerCertificate=True"
      DataProtection__KeysPath: /app/keys
      DefaultPasswords__Administrator: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD}
      DefaultPasswords__RegisteredUser: ${USER_PASSWORD:?Set USER_PASSWORD}
      JwtSettings__Issuer: ${JWT_ISSUER:?Set JWT_ISSUER}
      JwtSettings__Audience: ${JWT_AUDIENCE:?Set JWT_AUDIENCE}
      JwtSettings__ExpirationTimeInMinutes: "60"
      JwtSettings__SecurityKey: ${JWT_KEY:?Set JWT_KEY}
    volumes:
      - dataprotection_keys:/app/keys
    depends_on:
      - db

  frontend:
    image: kita-frontend:${RELEASE_TAG:?Set RELEASE_TAG}
    ports:
      - "127.0.0.1:${WEB_PORT:?Set WEB_PORT}:80"
    depends_on:
      - backend

  migrate:
    image: kita-migrate:${RELEASE_TAG:?Set RELEASE_TAG}
    profiles:
      - tools
    environment:
      ConnectionStrings__DefaultConnection: "Server=db,1433;Database=Kita;User Id=sa;Password=${SQL_PASSWORD:?Set SQL_PASSWORD};TrustServerCertificate=True"
    command:
      - --connection
      - "Server=db,1433;Database=Kita;User Id=sa;Password=${SQL_PASSWORD:?Set SQL_PASSWORD};TrustServerCertificate=True"

volumes:
  sqlserver_data:
  dataprotection_keys: