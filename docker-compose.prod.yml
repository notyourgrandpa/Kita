services:
  db:
    ports: !override
      - "127.0.0.1:1435:1433"
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    ports: !reset []
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      RunningInDocker: "true"
      AllowedCORS: "${ALLOWED_CORS_ORIGIN}"
      DataProtection__KeysPath: "/app/keys"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      migrate:
        condition: service_completed_successfully

    volumes:
      - dataprotection_keys:/app/keys

  frontend:
    ports: !override
      - "127.0.0.1:8081:80"
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  migrate:
    build:
      context: .
      dockerfile: Kita.Infrastructure/Dockerfile.migrations
    environment:
      ConnectionStrings__DefaultConnection: "Server=db,1433;Database=GeneralPurposeApplication;User Id=sa;Password=${DB_SA_PASSWORD};TrustServerCertificate=True"
    command:
      - "--connection"
      - "Server=db,1433;Database=GeneralPurposeApplication;User Id=sa;Password=${DB_SA_PASSWORD};TrustServerCertificate=True"
    depends_on:
      db-health:
        condition: service_completed_successfully
    restart: "no"
volumes:
  dataprotection_keys: